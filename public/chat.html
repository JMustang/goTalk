<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>goTalk Chat</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f3f4f6;
        margin: 0;
        padding: 24px;
      }
      .chat {
        max-width: 700px;
        margin: 0 auto;
        background: #1f2937;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin-top: 0;
      }
      #messages {
        min-height: 280px;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 12px;
        background: #0f172a;
        margin-bottom: 16px;
      }
      .message {
        background: #1d4ed8;
        color: white;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 8px 0;
        display: inline-block;
        max-width: 90%;
      }
      .controls {
        display: flex;
        gap: 10px;
      }
      input {
        flex: 1;
        border: 1px solid #4b5563;
        border-radius: 8px;
        background: #111827;
        color: white;
        padding: 10px 12px;
      }
      button {
        background: #22c55e;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #16a34a;
      }
    </style>
  </head>
  <body>
    <div class="chat">
      <h1>goTalk</h1>
      <div id="messages"></div>
      <div class="controls">
        <input type="text" id="inpMess" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      const inpMess = document.getElementById("inpMess");
      const messagesElm = document.getElementById("messages");
      const ws = new WebSocket(`ws://${location.host}/ws`);

      ws.addEventListener("open", () => {
        appendMessage("Connected to the chat.");
      });

      ws.addEventListener("message", (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload.message) {
            appendMessage(payload.message);
          }
        } catch (error) {
          appendMessage(event.data);
        }
      });

      ws.addEventListener("close", () => {
        appendMessage("Connection closed. Refresh the page to reconnect.");
      });

      function appendMessage(mess) {
        const messElm = document.createElement("div");
        messElm.className = "message";
        messElm.innerText = mess;
        messagesElm.appendChild(messElm);
        messagesElm.scrollTop = messagesElm.scrollHeight;
      }

      function sendMessage() {
        const value = inpMess.value.trim();
        if (!value) {
          return;
        }

        const payload = {
          id: Date.now(),
          message: value,
        };

        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(payload));
        } else {
          fetch("/api/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          })
            .then((res) => res.json())
            .then((result) => appendMessage(result.message))
            .catch((error) => console.error(error));
        }

        inpMess.value = "";
      }

      inpMess.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
